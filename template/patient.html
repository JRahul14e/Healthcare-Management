{% extends 'base.html' %}
{% block content %}
<style>
    /* Form Container */
form {
    width: 50%;
    margin: 40px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Form Labels */
label {
    display: block;
    font-weight: bold;
    margin: 10px 0 5px;
    color: #333;
}

/* Form Inputs & Selects */
input, select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

/* Placeholder Styling */
textarea::placeholder,
input::placeholder {
    color: #aaa;
}

/* Button Styling */
button {
    width: 100%;
    padding: 12px;
    background-color: #28a745;
    border: none;
    color: white;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

button:hover {
    background-color: #218838;
}

/* Responsive Design */
@media (max-width: 768px) {
    form {
        width: 90%;
    }
    
    input, select, textarea {
        font-size: 14px;
    }
    
    button {
        font-size: 16px;
    }
}
</style>
<form method="post" action="{% url 'add_patient' %}">
    {% csrf_token %}
    <label for="blood_type">Patient </label>
    <select id="blood_type" name="id" required>
        <option value="">Select</option>
        {% for info in userinfo %}
            <option value="{{ info.id }}">{{ info.username }}</option>
        {% endfor %}
    </select>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="date_of_birth">
    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
    <label for="blood_type">Blood Type:</label>
    <select id="blood_type" name="blood_type" required>
        <option value="">Select</option>
        {% for blood in blood_types %}
            <option value="{{ blood.id }}">{{ blood.name }}</option>
        {% endfor %}
    </select>
    <label>Need organ/Blood</label>
    <select id="gender" name="required" required>
        <option value="">Select</option>
        <option value="Blood">Blood</option>
        <option value="Organ">Organ</option>
    </select>
    <label for="chronic_conditions">Chronic Conditions:</label>
    <textarea id="chronic_conditions" name="chronic_conditions" placeholder="E.g., Diabetes, Hypertension"></textarea>

    <label for="medications">Medications:</label>
    <textarea id="medications" name="medications" placeholder="List ongoing medications"></textarea>

    <label for="emergency_contact">Emergency Contact:</label>
    <input type="tel" id="emergency_contact" name="emergency_contact" placeholder="Enter emergency contact number">

    <label for="last_checkup_date">Last Checkup Date:</label>
    <input type="date" id="last_checkup_date" name="last_checkup_date">
    <button type="submit">Submit</button>
</form>
{% endblock %}
